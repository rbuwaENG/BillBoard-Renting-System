name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

      # Unit tests mock @/lib/supabase globally (src/test/setup.ts), so they
      # need no Supabase env and make no network calls.
      - run: npm run test

      # Migrations applied to an in-process Postgres (PGlite).
      - run: npm run test:db

      # `build` runs `tsc -b` first, so this is also the typecheck.
      - run: npm run build
        env:
          # Set as repository variables (Settings -> Secrets and variables ->
          # Actions -> Variables). The anon key is public by design (RLS
          # protects the data). Without them the build still succeeds; the
          # bundle just shows the configuration-error screen.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
